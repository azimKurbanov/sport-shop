<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — SPORT SHOP</title>
  <meta name="description" content="Экипировка для бокса, MMA, фитнеса и спортивная одежда в одном месте.">
  <meta name="theme-color" content="#0B0B0C">
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Oswald:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="auth">
  <section class="auth-side">
    <a class="logo" href="index.html">SPORT<span>/</span>SHOP</a>
    <div>
      <blockquote>Спорт — <span class="stroke">это образ жизни!</span></blockquote>
      <p>Зарегистрируйтесь — вас ждут 40+ спортивных товаров, избранное и быстрый заказ.</p>
    </div>
  </section>

  <section class="auth-main">
    <div class="auth-top">
      <details class="lang">
        <summary aria-label="Выбор языка"><svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>RU<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
        <ul>
        <li><a href="../kirish.html" lang="uz" hreflang="uz">O'zbekcha <small>UZ</small></a></li>
        <li><a href="../ru/kirish.html" lang="ru" hreflang="ru" aria-current="true">Русский <small>RU</small></a></li>
        <li><a href="../en/kirish.html" lang="en" hreflang="en">English <small>EN</small></a></li>
        </ul>
      </details>
      <a class="guest" href="index.html">Войти как гость <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>

    <div class="auth-box">
      <h1>Добро пожаловать в мир спорта!</h1>
      <p>Создайте аккаунт или войдите в свой.</p>

      <div class="tabs" role="radiogroup" aria-label="Тип формы">
        <input type="radio" name="tab" id="t-reg" checked>
        <label for="t-reg">Регистрация</label>
        <input type="radio" name="tab" id="t-login">
        <label for="t-login">Вход</label>
      </div>

      <form class="panel p-reg" action="index.html" method="get">
        <div class="field">
          <label for="r-email">Email</label>
          <input id="r-email" type="email" placeholder="example@gmail.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="r-pass">Пароль</label>
          <input id="r-pass" type="password" placeholder="Минимум 6 символов" minlength="6" autocomplete="new-password" required>
          <span class="hint">Пароль — не меньше 6 символов.</span>
        </div>
        <div class="field">
          <label for="r-pass2">Повторите пароль</label>
          <input id="r-pass2" type="password" placeholder="Введите пароль ещё раз" minlength="6" autocomplete="new-password" required>
        </div>
        <button class="btn btn-red" type="submit">Зарегистрироваться <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>

      <form class="panel p-login" action="index.html" method="get">
        <div class="field">
          <label for="l-email">Email</label>
          <input id="l-email" type="email" placeholder="example@gmail.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="l-pass">Пароль</label>
          <input id="l-pass" type="password" placeholder="Минимум 6 символов" minlength="6" autocomplete="current-password" required>
        </div>
        <label class="check"><input type="checkbox"> Запомнить меня</label>
        <button class="btn btn-red" type="submit">Войти на сайт <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
